# Prompt Atelier behind Apache httpd
#
# A template, not a drop-in. Delivered under doc/examples/ and never installed
# automatically. Reaching into a running web server configuration stays the
# operator's decision.
#
# Required modules:
#
#   a2enmod proxy proxy_http headers ssl
#
# mod_remoteip is deliberately not among them. The application resolves the
# forwarded chain itself through server.trusted_proxies, so the module would
# have nothing to do here.
#
# The same three pairs as in the nginx template hold here as well:
#
#   1. X-Forwarded-For   <->  server.trusted_proxies
#   2. X-Forwarded-Proto <->  security.force_https
#   3. ProxyPass to 127.0.0.1  <->  server.host
#
# In config/config.yml of the installation:
#
#   server:
#     host: "127.0.0.1"
#     port: 9292
#     base_url: "https://prompts.example.com"
#     trusted_proxies: ["127.0.0.1"]
#   security:
#     force_https: true

<VirtualHost *:80>
    ServerName prompts.example.com

    # HTTP exists only to send people to HTTPS. Serving the application here as
    # well would hand out the session cookie unencrypted once, and once is
    # enough.
    Redirect permanent / https://prompts.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName prompts.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/prompts.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/prompts.example.com/privkey.pem

    # Start with a short max-age while trying this out: a wrong HSTS header
    # locks the domain to HTTPS for its whole duration and cannot be taken back
    # from the server side.
    Header always set Strict-Transport-Security "max-age=31536000"

    # mod_proxy_http adds X-Forwarded-For and X-Forwarded-Host by itself. Only
    # the protocol has to be said. Without it, or with trusted_proxies empty,
    # the application believes it runs on plain HTTP and leaves the Secure flag
    # off the session cookie: both headers are gated on that same list.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:9292/
    ProxyPassReverse / http://127.0.0.1:9292/

    # A long import should not be cut off in the middle by a proxy that has
    # stopped waiting.
    ProxyTimeout 120

    ErrorLog  ${APACHE_LOG_DIR}/promptatelier-error.log
    CustomLog ${APACHE_LOG_DIR}/promptatelier-access.log combined
</VirtualHost>
