# Prompt Atelier behind nginx
#
# A template, not a drop-in. It is delivered under doc/examples/ and is never
# installed automatically. Reaching into a running web server configuration
# stays the operator's decision.
#
# Three settings on this side belong together with three on the application
# side. Getting one of the three pairs wrong is the failure mode that is hard
# to see, so each is named here and in config.yml:
#
#   1. proxy_set_header X-Forwarded-For   <->  server.trusted_proxies
#   2. proxy_set_header X-Forwarded-Proto <->  security.force_https
#   3. proxy_pass to 127.0.0.1            <->  server.host
#
# In config/config.yml of the installation:
#
#   server:
#     host: "127.0.0.1"                 # NOT 0.0.0.0, see below
#     port: 9292
#     base_url: "https://prompts.example.com"
#     trusted_proxies: ["127.0.0.1"]    # the address nginx connects from
#   security:
#     force_https: true
#
# **`trusted_proxies` is the entry that matters, and it governs both headers.**
#
# X-Forwarded-For is read only from senders listed there. Left empty, the
# application uses the actual peer address, which behind a proxy is the proxy
# itself, so every visitor would share one rate limit and the audit log would
# record one address for everybody. Filled in with a network that is not yours,
# anybody can claim any address and both become worthless. Enter the proxy and
# nothing else.
#
# X-Forwarded-Proto is gated on the same list, and that consequence is easy to
# miss: with `trusted_proxies` empty the header below is ignored no matter what
# this file sets, the application concludes it is running on plain HTTP, and
# the session cookie goes out without its Secure attribute even though
# force_https is on. The two settings are not independent.

server {
    listen 80;
    listen [::]:80;
    server_name prompts.example.com;

    # HTTP exists only to send people to HTTPS. Serving the application here as
    # well would hand out the session cookie over an unencrypted connection
    # once, and once is enough.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prompts.example.com;

    ssl_certificate     /etc/letsencrypt/live/prompts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompts.example.com/privkey.pem;

    # The prompts of a whole team are the content here, so the browser is asked
    # to remember the encryption. Start with a short max-age while trying this
    # out: a wrong HSTS header locks the domain to HTTPS for its whole duration
    # and cannot be taken back from the server side.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Prompt bodies are long. The default of 1 MB is reached by a large import
    # file, and the refusal arrives as an nginx error page rather than as the
    # application's own message.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9292;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Appended, not replaced: the application reads the chain from the
        # right, discarding entries it does not trust. A configuration that
        # overwrote this header would throw away exactly the part it needs.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this, or with trusted_proxies empty, the application believes
        # it is running on plain HTTP and leaves the Secure flag off the
        # session cookie.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events are not used, but a long import should not be cut
        # off in the middle by a proxy that has stopped waiting.
        proxy_read_timeout 120s;
    }
}
